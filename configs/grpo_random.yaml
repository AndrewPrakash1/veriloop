# Arm A5_random — content-independent control: is any gain attributable to the verifier at all?
extends: base.yaml
stage: rl
algorithm: grpo            # RLOO is the fallback if GRPO is unstable at 3B
init_adapter: outputs/A1_sft
data:
  file: data/splits/train_rl.jsonl     # filtered to scenarios the SFT model solves 10-90% of the time
reward_funcs: veriloop.rewards.registry.random_reward
rollout_group_size: 8
steps: 300
batch_size: 2
lr: 1.0e-6
kl_coef: 0.0
clip_eps: 0.2
seed: 42
out: outputs/A5_random
# Not decoration. RLVR gains can come from clipping, output length or the base model,
# so without this arm an improvement is not attributable to the verifier.
# Report steps and tokens beside every score from every arm.
